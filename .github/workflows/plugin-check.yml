name: Plugin Check

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

concurrency:
  group: plugin-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-plugin.yml
    permissions:
      contents: read

  # Checks the built package, the one deployed to WordPress.org: errors fail
  # the job (and block the deploy), warnings are annotations.
  plugin-check:
    name: Plugin Check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The action comments its results on pull requests.
      pull-requests: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: elio-blocks
          path: package

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: package/elio-blocks
