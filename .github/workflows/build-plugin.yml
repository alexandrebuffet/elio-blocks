name: Build plugin package

# The package deployed to WordPress.org: built once, checked by Plugin Check,
# then deployed as is. Run it by hand for a zip to submit or test (artifact).
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build-plugin:
    name: Build plugin package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # 8.2 is the minimum the plugin supports (see elio-blocks.php).
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Build assets
        run: |
          npm ci
          npm run build

      # Symfony DI ships scoped in vendor-prefixed/: without the dev packages,
      # vendor/ only holds the autoloader.
      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      # rsync only creates the last directory of the destination.
      - name: Copy the package files
        run: |
          mkdir -p "$RUNNER_TEMP/package/elio-blocks"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/package/elio-blocks/"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elio-blocks
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 14
