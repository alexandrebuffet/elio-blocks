name: Deploy site

# The presentation site on GitHub Pages: docs/site/ assembled by
# scripts/build-site.mjs, plus the plugin package of main, which the Playground
# demo of the site installs. Deployed from main only (github-pages environment).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-plugin:
    name: Build plugin package
    uses: ./.github/workflows/build-plugin.yml
    permissions:
      contents: read

  build-site:
    name: Build site
    needs: build-plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build site
        run: node scripts/build-site.mjs _site

      - name: Download the plugin package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: elio-blocks
          path: ${{ runner.temp }}/package

      # The zip holds the elio-blocks/ folder, as a WordPress.org download.
      - name: Add the plugin zip for the demo
        working-directory: ${{ runner.temp }}/package
        run: zip -qr "$GITHUB_WORKSPACE/_site/elio-blocks.zip" elio-blocks

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy-site:
    name: Deploy site
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
