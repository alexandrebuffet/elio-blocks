name: Deploy and release WordPress plugin

on:
  push:
    tags:
      - '*'

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-on-main:
    name: Tag on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure the tag is merged into main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main. Merge develop into main (merge commit, not squash) before tagging."
            exit 1
          fi

  # Builds the package and runs Plugin Check on it: an error stops the deploy.
  plugin-check:
    name: Plugin Check
    needs: tag-on-main
    uses: ./.github/workflows/plugin-check.yml
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Deploy to WordPress.org
    needs: plugin-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the SVN secrets: main and release tags only, deployed on approval.
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/elio-blocks/
    permissions:
      contents: write
    steps:
      # For the .wordpress-org assets; the plugin files come from the package.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: elio-blocks
          path: package

      - name: Deploy to WordPress.org SVN repository
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: true
        env:
          SLUG: elio-blocks
          BUILD_DIR: package/elio-blocks
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
          token: ${{ secrets.GITHUB_TOKEN }}
